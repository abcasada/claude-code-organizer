name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Smoke test
        run: python -m claude_code_organizer --smoke-test

  deb:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7

      # dpkg-deb ships with dpkg, which is already in the base image.
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3

      - run: python3 packaging/linux/build_deb.py
      - run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb

      # Without Recommends there's no Qt: the server install, command line only.
      - name: Install the package without Qt
        run: apt-get install -y --no-install-recommends ./dist/*.deb

      - name: Command line check
        run: sh packaging/linux/check_cli.sh

      - name: Install Qt
        run: >
          apt-get install -y --no-install-recommends
          python3-pyside6.qtwidgets python3-pyside6.qtnetwork libxcb-cursor0

      - name: Smoke test the window
        run: QT_QPA_PLATFORM=offscreen claude-code-organizer --smoke-test

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error
